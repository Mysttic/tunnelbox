# Wersja dla pakietu instalacyjnego (ZIP) — używa obrazu wczytanego lokalnie z pliku
# (docker load w start.ps1 / start.sh). __IMAGE__ jest podmieniane na konkretny tag obrazu
# (tunnelbox:X.Y.Z) podczas budowania release'u. pull_policy: never — obraz pochodzi
# z paczki, a nie z rejestru; jeśli nie został wczytany, compose zgłosi czytelny błąd
# zamiast pobierać. Dlaczego privileged — README, „Why the container is privileged".
services:
  tunnelbox:
    image: __IMAGE__
    container_name: tunnelbox
    pull_policy: never
    privileged: true
    init: true
    ports:
      # Panel WWW: własny port + własna nazwa (http://tunnelbox.localhost:25263).
      # Przeglądarki rozwiązują dowolne *.localhost na pętlę zwrotną, więc nazwa
      # działa bez wpisu w pliku hosts i bez uprawnień administratora.
      - "127.0.0.1:25263:8080"
      # Pula portów na przekierowania — każdy port ma własny adres pętli zwrotnej
      # (13391 -> 127.0.0.2, ... 13449 -> 127.0.0.60), żeby Windows zapamiętywał
      # poświadczenia RDP osobno dla każdej maszyny. Szczegóły w docker-compose.yml.
      - "127.0.0.2:13391:13391"
      - "127.0.0.3:13392:13392"
      - "127.0.0.4:13393:13393"
      - "127.0.0.5:13394:13394"
      - "127.0.0.6:13395:13395"
      - "127.0.0.7:13396:13396"
