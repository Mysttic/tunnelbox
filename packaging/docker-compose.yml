      - "127.0.0.60:13449:13449"
    volumes:
      # Dane użytkownika (sejf) leżą poza folderem programu — start.ps1 ustawia
      # TUNNELBOX_DATA na %LOCALAPPDATA%\Tunnelbox\data, a start.sh na
      # ~/.local/share/tunnelbox/data, dzięki czemu aktualizacja (rozpakowanie nowej
      # paczki gdziekolwiek) nie gubi zapisanych połączeń.
      - "${TUNNELBOX_DATA:-./data}:/data"
    restart: unless-stopped
